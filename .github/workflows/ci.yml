name: ci

# Three jobs, because they fail for different reasons and a reader wants to know
# which: `lint` is the shape of the code, `test` is what it does, and `types` is
# what it claims. This package has no NIF and no native dependency, so the jobs are
# short.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.5"
  OTP_VERSION: "29.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      # A version edited in `mix.exs` and not in `VERSION` survives until the tag,
      # and then the tag is refused — so the disagreement is caught on the push
      # that made it.
      - run: elixir scripts/release.exs check
      # The tarball a tag would publish, built on every push: a `files:` entry that
      # names a file the repository no longer has is a package with half its
      # documentation in it, and a tag is the wrong place to find that out.
      - run: mix hex.build

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix test
      # The two tests that start a second node need a distributed VM, which
      # `mix test` does not start; this one is started with a name. No `--cookie`:
      # the peer inherits the default one, and a cookie on one side only is a peer
      # whose handshake is refused.
      - run: elixir --name plugin_ci@127.0.0.1 -S mix test --only distributed

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-plt-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix dialyzer
