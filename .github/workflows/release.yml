name: release

# A tag does two things, and only a tag: publishes the package to Hex —
# `mix hex.publish`, which wants the `HEX_API_KEY` secret on this repository — and
# attaches the source to a GitHub release, so the tag explains itself. Nothing is
# published from a branch: `ci` proves a commit, a tag says it is a version.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  # `mix hex.publish` publishes the docs as well as the package, and docs are built
  # by ex_doc — a development dependency — so this job runs in `dev`.
  MIX_ENV: dev
  ELIXIR_VERSION: "1.20.5"
  OTP_VERSION: "29.1"

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # The tag is a claim and `VERSION` is the file it claims about. A tag that
      # disagrees with the tree publishes a number nobody reviewed, so it stops
      # here — before the secret, before the release, before Hex.
      - name: the tag agrees with VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$tag" != "$version" ]; then
            echo "::error::the tag says $tag, VERSION says $version — bump the version and re-tag"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is VERSION $version"

      # Before the work rather than after it: a repository without the secret is
      # a release that cannot happen, and finding that out from `mix hex.publish`
      # costs a full build to read an authentication error.
      - name: the secret this job publishes with
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "::error::HEX_API_KEY is not set on this repository, so a tag cannot publish."
            echo "Add it with: gh secret set HEX_API_KEY -R \${{ github.repository }}"
            exit 1
          fi

      - run: mix deps.get
      - run: mix test
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
